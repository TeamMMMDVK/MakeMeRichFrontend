<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Stock Info</title>
  <link rel="stylesheet" href="css/styles.css">

</head>
<body>
<div class="container">
  <h1>Hi I am a very experienced financial advisor and I would love to help you</h1>
  <h2>What stock do you want to know something about?</h2>

  <label for="stock-select">Choose a stock:</label>
  <select id="stock-select">
    <option value="GOOGL">Alphabet Inc (GOOGL)</option>
    <option value="AMZN">Amazon (AMZN)</option>
    <option value="AAPL">Apple Inc (AAPL)</option>
    <option value="BRK.A">Berkshire Hathaway Inc (BRK.A)</option>
    <option value="AVGO">Broadcom Inc (AVGO)</option>
    <option value="COST">Costco Wholesale Corporation (COST)</option>
    <option value="LLY">Eli Lilly and Company (LLY)</option>
    <option value="XOM">Exxon Mobil Corporation (XOM)</option>
    <option value="JNJ">Johnson & Johnson (JNJ)</option>
    <option value="JPM">JPMorgan Chase & Co (JPM)</option>
    <option value="MA">Mastercard Incorporated (MA)</option>
    <option value="META">Meta (META)</option>
    <option value="MSFT">Microsoft (MSFT)</option>
    <option value="NVDA">NVIDIA Corporation (NVDA)</option>
    <option value="ORCL">Oracle Corporation (ORCL)</option>
    <option value="PG">Procter & Gamble Co (PG)</option>
    <option value="TSLA">Tesla (TSLA)</option>
    <option value="UNH">UnitedHealth Group Incorporated (UNH)</option>
    <option value="V">Visa Inc (V)</option>
    <option value="WMT">Walmart Inc (WMT)</option>
  </select>

  <label for="question">Your question about the selected stock:</label>
  <input type="text" id="question" placeholder="e.g., What is the forecast for the next quarter?"/>

  <button id="submit-btn">Submit</button>

  <label>Response:</label>
  <div class="response-box" id="response-box">
    <!-- Response will appear here -->
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
